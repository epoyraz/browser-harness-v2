name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run ruff check harness tests
      - run: uv run pytest
      - name: every module has a test file (DESIGN.md §2.2)
        shell: bash
        run: |
          missing=0
          for f in $(find harness -name '*.py' ! -name '__init__.py'); do
            t="tests/unit/test_$(basename $f)"
            [ -f "$t" ] || { echo "::error::$f has no $t"; missing=1; }
          done
          exit $missing

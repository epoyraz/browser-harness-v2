[project]
name = "browser-harness-v2"
version = "0.1.0"
description = "Agent-facing browser control over CDP. Fewer decisions, typed outcomes, replayable."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Floor + cap instead of v1's exact pin: v2 owns its transport (WebSocketTransport is
# the only websockets touchpoint), so minors can float; capped below 18 until tested.
dependencies = ["websockets>=15,<18"]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[project.scripts]
bh = "harness.cli.main:main"

# CI runs `uv sync --dev`; without this group it installed neither, and every
# `uv run ruff` / `uv run pytest` step failed on a missing command.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

# Without an explicit list the sdist is an unfiltered copy of the working tree, which is
# how jobs.json and a required.txt holding a real salary would have shipped to PyPI — and
# PyPI never lets a filename be re-uploaded.
[tool.hatch.build.targets.sdist]
include = ["harness", "tests", "docs", "SKILL.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # e.g. the keepalive control test, which waits out a real ping timeout.
    "slow: long-running checks; deselect with -m 'not slow' for the fast loop",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# bh scripts: goto/js/fill_form/snapshot are bound by the runtime before exec, so every
# helper reads as an undefined name to a static analyser.
"dashboard/*_job.py" = ["F821"]
